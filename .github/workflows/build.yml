name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip cython==0.29.36 buildozer
      - name: Build
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log
      - name: Show real error
        if: failure()
        run: |
          grep -n -E "error:|Error [0-9]|FAILED|fatal error|Traceback|No matching|ModuleNotFound|Command failed" build.log | grep -v "DEF" | head -40
          echo "=== last lines before env dump ==="
          grep -n "# Command failed" build.log | head -1
      - name: Upload log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - uses: actions/upload-artifact@v4
        with:
          name: tg-cleaner-apk
          path: bin/*.apk
